  <rect x="40" y="40" width="920" height="520" fill="#ffffff" stroke="#2b2f36" stroke-width="8"/>
  <!-- Cloisons -->
  <g stroke="#2b2f36" stroke-width="5" fill="none">
    <line x1="300" y1="40" x2="300" y2="260"/>
    <line x1="620" y1="40" x2="620" y2="260"/>
    <line x1="40" y1="260" x2="130" y2="260"/>
    <line x1="190" y1="260" x2="300" y2="260"/>
    <line x1="360" y1="260" x2="560" y2="260"/>
    <line x1="620" y1="260" x2="800" y2="260"/>
    <line x1="860" y1="260" x2="960" y2="260"/>
    <line x1="40" y1="340" x2="200" y2="340"/>
    <line x1="260" y1="340" x2="500" y2="340"/>
    <line x1="560" y1="340" x2="700" y2="340"/>
    <line x1="760" y1="340" x2="960" y2="340"/>
    <line x1="500" y1="340" x2="500" y2="560"/>
